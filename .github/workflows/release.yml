name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Check tag matches csproj version
        run: |
          VERSION=$(dotnet msbuild GamesMayer.Diagnostics/GamesMayer.Diagnostics.csproj -getProperty:Version)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match <Version>$VERSION</Version> in GamesMayer.Diagnostics.csproj"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test GamesMayer.Diagnostics.Tests/GamesMayer.Diagnostics.Tests.csproj -c Release

      - name: Pack
        run: dotnet pack GamesMayer.Diagnostics/GamesMayer.Diagnostics.csproj -c Release -o nupkg

      # Trusted Publishing: exchanges the GitHub OIDC token for a short-lived nuget.org API key.
      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: |
          dotnet nuget push "nupkg/GamesMayer.Diagnostics.$VERSION.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate

      # GitHub renames release assets that start with a dot, so strip it.
      - name: Stage templates
        run: |
          mkdir -p release-assets
          cp templates/.editorconfig/.editorconfig.source release-assets/editorconfig.source
          cp templates/.editorconfig/.editorconfig.root release-assets/editorconfig.root

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/editorconfig.source
            release-assets/editorconfig.root
            nupkg/GamesMayer.Diagnostics.${{ env.VERSION }}.nupkg
